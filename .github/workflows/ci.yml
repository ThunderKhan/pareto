name: Recruiter search CI

on:
  push:
    branches:
      - feat/recruiter-search
      - "feat/ai-*"
      - feat/homepage-v2
      - main
      - integration/release-20261114
      - feat/private-resume-ingestion
      - feat/durable-resume-batch-workers
      - feat/ingestion-quality-audit
  pull_request:
    branches:
      - main
      - feat/private-resume-ingestion
      - feat/durable-resume-batch-workers
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: pareto
          POSTGRES_PASSWORD: pareto_ci_only
          POSTGRES_DB: pareto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pareto -d pareto"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://pareto:pareto_ci_only@127.0.0.1:5432/pareto
      PARETO_TEST_DATABASE_URL: postgresql://pareto:pareto_ci_only@127.0.0.1:5432/pareto
      DEMO_OWNER_ID: 11111111-1111-4111-8111-111111111111
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client, migrate and verify repeatable test seed
        run: |
          pnpm db:generate
          pnpm db:deploy
          pnpm db:seed
          pnpm db:seed
      - name: Lint, typecheck, and unit and PostgreSQL tests
        run: pnpm check
      - name: Run offline synthetic extraction-quality evaluation (no model keys)
        run: pnpm --filter @pareto/backend ingest:evaluate
      - name: Verify independent ingestion worker runtime against PostgreSQL
        run: pnpm ingest:worker
        env:
          INGEST_WORKER_ONCE: "1"
      - name: Production build
        run: pnpm build
      - name: Install Chromium for public/browser security smoke tests
        run: pnpm --filter @pareto/frontend exec playwright install --with-deps chromium
      - name: Playwright browser tests
        run: pnpm test:e2e
      - name: Upload cross-route browser screenshots and Playwright diagnostics
        if: always() && (github.event_name == 'pull_request' || github.ref_name == 'feat/homepage-v2' || github.ref_name == 'main')
        uses: actions/upload-artifact@v4
        with:
          name: pareto-ui-browser-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Production Docker image build
        run: docker build -t pareto:ci .
      - name: Boot production container and verify liveness + signed-out access denial
        shell: bash
        run: |
          docker run --rm -d --name pareto-ci-runtime --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PORT=3000 pareto:ci
          trap 'docker rm -f pareto-ci-runtime >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then docker logs pareto-ci-runtime; exit 1; fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/api/v1/search?q=Asha')
          if [[ "$status" != "401" ]]; then
            echo "::error::Unsigned candidate search returned HTTP $status instead of 401"
            exit 1
          fi
          echo "Production container health OK; unsigned candidate API denied with 401."

  recruiter-live:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'integration/release-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: pareto-demo
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: pareto
          POSTGRES_PASSWORD: pareto_live_ci_only
          POSTGRES_DB: pareto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pareto -d pareto"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://pareto:pareto_live_ci_only@127.0.0.1:5432/pareto
      DIRECT_DATABASE_URL: postgresql://pareto:pareto_live_ci_only@127.0.0.1:5432/pareto
      DEMO_OWNER_ID: ${{ vars.PARETO_E2E_USER_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      PARETO_E2E_EMAIL: ${{ secrets.PARETO_E2E_EMAIL }}
      PARETO_E2E_PASSWORD: ${{ secrets.PARETO_E2E_PASSWORD }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Check secure live acceptance configuration
        shell: bash
        run: |
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY DEMO_OWNER_ID PARETO_E2E_EMAIL PARETO_E2E_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Required environment value ${name} is missing"; exit 1; fi
          done
          if [[ -z "$GOOGLE_GENERATIVE_AI_API_KEY" || -z "$GEMINI_MODEL" ]] && [[ -z "$GROQ_API_KEY" || -z "$GROQ_MODEL" ]]; then
            echo "::error::Configure at least one complete Gemini or Groq provider pair"; exit 1
          fi
          if [[ ! "$DEMO_OWNER_ID" =~ ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$ ]]; then
            echo "::error::PARETO_E2E_USER_ID must be the actual demo recruiter's Supabase UUID"; exit 1
          fi
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Migrate and seed test recruiter's PostgreSQL workspace
        run: |
          pnpm db:generate
          pnpm db:deploy
          pnpm db:seed
      - name: Build Next.js release against the configured Supabase project
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @pareto/frontend exec playwright install --with-deps chromium
      - name: Verify actual configured AI providers independently (no recorded responses)
        run: pnpm --filter @pareto/backend exec vitest run src/search/provider-live.test.ts --reporter=default
        env:
          PARETO_VERIFY_LIVE_MODELS: "1"
      - name: Real signed-in recruiter workflow (no mocks)
        run: pnpm --filter @pareto/frontend exec playwright test recruiter.spec.ts --reporter=line --retries=0
        env:
          PARETO_REQUIRE_LIVE: "1"
