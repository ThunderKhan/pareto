services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://pareto:pareto_local_only@db:5432/pareto
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      PARETO_SEMANTIC_SEARCH: ${PARETO_SEMANTIC_SEARCH:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: .
      target: migrate
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    environment:
      DATABASE_URL: postgresql://pareto:pareto_local_only@db:5432/pareto
      DEMO_OWNER_ID: ${DEMO_OWNER_ID:-}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: pareto
      POSTGRES_USER: pareto
      POSTGRES_PASSWORD: pareto_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pareto -d pareto"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
