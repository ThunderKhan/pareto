services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pareto:pareto_local_only@db:5432/pareto?schema=public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pareto
      POSTGRES_USER: pareto
      POSTGRES_PASSWORD: pareto_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pareto -d pareto"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
